name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# One build per branch at a time, so two quick pushes can't race on the "latest" release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log; then
            # Surface compiler errors as annotations, which are readable without signing in.
            msg=$(grep -E '^e: |error:|What went wrong' -A2 build.log | head -40 | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')
            echo "::error title=assembleDebug failed::$msg"
            exit 1
          fi
      - name: Build release APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # Surface compiler errors as annotations, which are readable without signing in.
            msg=$(grep -E '^e: |error:|What went wrong' -A2 build.log | head -40 | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')
            echo "::error title=assembleRelease failed::$msg"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VaultLock-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      # Publish the debug APK to a fixed public link that can be opened straight from a phone:
      # https://github.com/<owner>/<repo>/releases/download/latest/VaultLock.apk
      - name: Publish APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VaultLock.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VaultLock.apk \
            --target "$GITHUB_SHA" \
            --title "VaultLock (latest build)" \
            --notes "Debug build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. Download VaultLock.apk below and install it on your phone."
