name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log; then
            # Surface compiler errors as annotations, which are readable without signing in.
            msg=$(grep -E '^e: |error:|What went wrong' -A2 build.log | head -40 | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')
            echo "::error title=assembleDebug failed::$msg"
            exit 1
          fi
      - name: Build release APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # Surface compiler errors as annotations, which are readable without signing in.
            msg=$(grep -E '^e: |error:|What went wrong' -A2 build.log | head -40 | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')
            echo "::error title=assembleRelease failed::$msg"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VaultLock-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
